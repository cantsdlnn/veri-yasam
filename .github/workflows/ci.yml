name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements-dev.txt
      - run: pip-audit --local
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m compileall -q app

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container imajını doğrula
        run: docker build --tag veri-yasam:ci .
